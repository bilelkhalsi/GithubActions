name: Run Camunda 7 Workflow

on:
  push:
    branches: [ dev ]

jobs:
  camunda-run:
    runs-on: ubuntu-latest

    services:
      camunda:
        image: camunda/camunda-bpm-platform:run-latest
        ports:
          - 8080:8080
        options: >-
          --health-cmd="curl -f http://localhost:8080/camunda"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy BPMN model
        run: |
          curl -X POST \
            -H "Content-Type: multipart/form-data" \
            -F "deployment-name=hello-world-workflow" \
            -F "hello-world-process.bpmn=@/bpmn/hello-world-process.bpmn" \
            http://localhost:8080/engine-rest/deployment/create
